<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
  <script src="lang.js" defer></script>
</head>
<body data-page-title="page_title_contact">
  <header class="navbar">
    <a href="index.html" class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Derrick Fosu Adofo</span>
      <span class="brand-role" data-i18n="brand_role">Data Analyst</span>
    </a>
    <div class="nav-right">
      <nav class="nav-links">
        <a href="projects.html" data-i18n="nav_projects">Projects</a>
        <a href="resume.html" data-i18n="nav_resume">Resume</a>
        <a href="contact.html" class="active" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language switcher">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="de">DE</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="contact-grid">
      <div>
        <h1 class="page-title" data-i18n="contact_title">Contact</h1>
        <p class="page-subtitle" data-i18n="contact_subtitle">
          Looking forward to hearing from you regarding Data Analyst, BI, or Controlling roles and projects.
        </p>

        <div class="contact-detail-block">
          <p class="contact-label" data-i18n="contact_email_label">Email</p>
          <a href="mailto:derrickfosuadofo@gmail.com" class="contact-value">derrickfosuadofo@gmail.com</a>
        </div>

        <div class="contact-detail-block">
          <p class="contact-label" data-i18n="contact_phone_label">Phone</p>
          <a href="tel:+4915737942981" class="contact-value">+49 1573 7942981</a>
        </div>

        <div class="contact-detail-block">
          <p class="contact-label" data-i18n="contact_loc_label">Location</p>
          <p class="contact-value" data-i18n="contact_loc_val">Wittlich, Germany (Open to travel)</p>
        </div>

        <div class="social-links">
          <a href="https://www.linkedin.com/in/derrickfosuadofo" target="_blank" rel="noopener" class="social-btn" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4V8.5zm7.5 0h3.8v2h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V23h-4v-7.4c0-1.76-.03-4.03-2.45-4.03-2.46 0-2.84 1.92-2.84 3.9V23h-4V8.5z"/></svg>
          </a>
          <a href="https://github.com/derrickadofo" target="_blank" rel="noopener" class="social-btn" aria-label="GitHub">
            <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
          </a>
        </div>
      </div>

      <form id="portfolio-contact-form" class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
        <div class="form-group">
          <label for="first-name" data-i18n="form_first">First Name</label>
          <input type="text" id="first-name" name="first_name" />
        </div>
        <div class="form-group">
          <label for="last-name" data-i18n="form_last">Last Name</label>
          <input type="text" id="last-name" name="last_name" />
        </div>
        <div class="form-group">
          <label for="email" data-i18n="form_email">Email *</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="subject" data-i18n="form_subject">Subject</label>
          <input type="text" id="subject" name="subject" />
        </div>
        <div class="form-group full-width">
          <label for="message" data-i18n="form_message">Message *</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <div class="form-submit-row">
          <button type="submit" class="btn-circle-submit" data-i18n="form_submit">Submit</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
